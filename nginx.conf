# Front proxy between the Cloud in a Bottle router and the T3 Code server.
#
# - /_healthz answers as soon as nginx is up, without the owner header the readiness probe does not carry.
# - Everything else requires X-OpenHost-Is-Owner: true. The router sets that header itself and strips any copy a
#   client sends, and it already refuses anonymous requests; this is a second gate in front of what is a remote shell.
# - /_bottle/ goes to pair_helper.py, the rest to T3 Code, including its WebSockets.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # No access log: T3 Code puts short-lived WebSocket tickets in query strings.
    access_log off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_openhost_is_owner $is_owner {
        default 0;
        "true"  1;
    }

    # The public host and scheme the visitor used, as reported by the router. T3 Code compares a browser's Origin
    # against the host, and builds pairing and OAuth URLs from both, so they must reach it unchanged.
    map $http_x_forwarded_host $forward_host {
        default $http_x_forwarded_host;
        ""      $host;
    }
    map $http_x_forwarded_proto $forward_proto {
        default $http_x_forwarded_proto;
        ""      http;
    }

    # T3 Code names its browser session cookie t3_session_<suffix>.
    map $http_cookie $has_t3_session {
        default            0;
        "~(^|;\s*)t3_session" 1;
    }

    # Attachments and pasted context can be large.
    client_max_body_size 512m;

    server {
        listen 8080;
        server_name _;

        # Redirects stay path-only so the browser resolves them against the public domain.
        absolute_redirect off;

        # Agent runs and terminals hold connections open for hours.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $forward_host;
        proxy_set_header X-Forwarded-Host  $forward_host;
        proxy_set_header X-Forwarded-Proto $forward_proto;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Streams (agent output, terminal, browser preview) must not sit in a buffer.
        proxy_buffering off;
        proxy_request_buffering off;

        location = /_healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location @starting {
            default_type text/html;
            add_header Retry-After 5 always;
            return 503 "<!doctype html><meta charset=utf-8><meta http-equiv=refresh content=5><title>T3 Code is starting</title><body style=\"font-family:system-ui;padding:2rem\"><h1>T3 Code is starting</h1><p>This page reloads on its own.</p>";
        }

        location /_bottle/ {
            if ($is_owner = 0) {
                return 403 "forbidden\n";
            }
            proxy_pass http://127.0.0.1:3774;
        }

        # A browser with no T3 Code session is sent to pair first; the owner is already authenticated by the router,
        # so T3 Code's own pairing prompt would only be a second login.
        location = / {
            if ($is_owner = 0) {
                return 403 "forbidden\n";
            }
            if ($has_t3_session = 0) {
                return 302 /_bottle/pair;
            }
            proxy_pass http://127.0.0.1:3773;
            proxy_intercept_errors on;
            error_page 502 504 = @starting;
        }

        location / {
            if ($is_owner = 0) {
                return 403 "forbidden\n";
            }
            proxy_pass http://127.0.0.1:3773;
        }
    }
}
